<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Бонуска{% endblock %}</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 10px 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        hr {
            margin: 20px 0;
        }
    </style>

</head>

<body>

<div class="container">

{% block content %}
{% endblock %}

</div>

</body>
</html>
