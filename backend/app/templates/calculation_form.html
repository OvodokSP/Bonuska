{% extends "base.html" %}

{% block title %}Создать расчёт{% endblock %}

{% block content %}
<h1>Создать расчёт</h1>

<p><strong>BDM:</strong> {{ profile.bdm_name }}</p>
<p><strong>Город:</strong> {{ profile.city }}</p>

<form method="post" action="/calculations">
    <input type="hidden" name="profile_id" value="{{ profile.id }}">

    <p>
        <label>Отчётный месяц</label><br>
        <input type="text" name="month" required>
    </p>

    <p>
        <label>Отчётный год</label><br>
        <input type="number" name="year" required>
    </p>

    <hr>

    <h3>Планы</h3>

    <p>
        <label>План СТМ</label><br>
        <input type="number" name="stm_plan" step="0.01" required>
    </p>

    <p>
        <label>План Электрика</label><br>
        <input type="number" name="electrical_plan" step="0.01" required>
    </p>

    <p>
        <label>
            <input type="checkbox" name="sales_department_plan_done" value="true">
            План отдела продаж выполнен
        </label>
    </p>

    <button type="submit">Создать расчёт</button>
</form>

<p><a href="/profiles/{{ profile.id }}">← Назад</a></p>
{% endblock %}
